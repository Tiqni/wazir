# Wazir configuration — copy to wazir.yaml and edit.
#
# Any field can be overridden by an environment variable named
# WAZIR_<SECTION>_<FIELD>, e.g. WAZIR_PROJECT_NUMBER or WAZIR_GITHUB_OWNER_TYPE.
# Secrets are best supplied via env rather than committed to a file:
#   export WAZIR_GITHUB_PAT=...             # overrides github.pat
#   export WAZIR_GITHUB_WEBHOOK_SECRET=...  # overrides github.webhook_secret
#
# A config file is optional: with none present, Wazir reads everything from
# the environment (plus the defaults shown below).

github:
  auth: pat # pat | app
  owner_type: user # user | org
  # pat: ""              # prefer WAZIR_GITHUB_PAT
  # webhook_secret: ""   # prefer WAZIR_GITHUB_WEBHOOK_SECRET (used by ParseEvent)
  # app_id: 0            # for auth: app (wired in M1+)
  # private_key: ""
  # installation_id: 0

project:
  owner: your-login # the user/org login that owns the board
  number: 1 # Projects v2 board number
  board_name: Wazir # name used by `provision` when creating the board

# Repos Wazir is allowed to act on (multi-repo allow-list).
repos:
  - your-login/your-repo

bot_login: your-bot-login # filters the bot's own webhook events

store:
  db_path: wazir.db

# Headless claude-CLI brain (M2). Secrets/auth for `claude` come from the CLI's
# own login, not this file. Override any field via WAZIR_CLAUDE_<FIELD>.
claude:
  bin: claude            # path to the claude binary
  model: ""              # "" = CLI default
  timeout: 5m            # per-invocation deadline
  max_brainstorm_turns: 8 # cap on the clarifying-question loop

# Local git layout for plan/execute (M4). Clones are one-per-repo and reused;
# each in-flight card gets its own worktree. Auth reuses github.pat — no git
# credential lives in any worktree's .git/config.
forge:
  git_bin: git
  clone_root: ~/.wazir/clones
  worktree_root: ~/.wazir/worktrees
  base_branch: main

